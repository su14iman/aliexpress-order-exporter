<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
    <meta charset="UTF-8">
    <title>AliExpress Order Master</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { max-width: 1400px; margin: 0 auto; padding: 30px; }
    </style>
</head>
<body>
    <header>
        <h2>📦 AliExpress Order Master</h2>
        <div class="btn-container">
            <button id="downloadCSV">📊 Download Selected</button>
        </div>
    </header>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th><input type="checkbox" id="selectAll" checked></th>
                    <th>#</th>
                    <th>Image</th>
                    <th>Order ID</th>
                    <th>Item ID</th>
                    <th>Store</th>
                    <th>Product & Details</th>
                    <th>Date</th>
                    <th>Unit Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Invoice</th>
                </tr>
            </thead>
            <tbody id="orderTable">
                <tr>
                    <td colspan="12" class="loading-text">No data found. Fetch data from the popup first.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="common.js"></script>
    <script src="viewer.js"></script>
</body>
</html>
