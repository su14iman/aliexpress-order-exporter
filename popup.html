<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>📦 AliExpress Order Master</h2>
        <div class="btn-container">
            <button id="extract">🚀 Fetch Data</button>
            <button id="downloadCSV">📊 Download Selected</button>
            <button id="downloadInvoices">🧾 Download Invoices (PDF)</button>
            <button id="openFullPage">🔗 Open Full Page</button>
        </div>
    </header>
    <div id="invoiceStatus" class="invoice-status"></div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th><input type="checkbox" id="selectAll" checked></th>
                    <th>#</th>
                    <th>Image</th>
                    <th>Order ID</th>
                    <th>Item ID</th>
                    <th>Store</th>
                    <th>Product & Details</th>
                    <th>Date</th>
                    <th>Unit Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Invoice</th>
                </tr>
            </thead>
            <tbody id="orderTable">
                <tr>
                    <td colspan="12" class="loading-text">Click "Fetch Data" to start...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="common.js"></script>
    <script src="popup.js"></script>
</body>
</html>
